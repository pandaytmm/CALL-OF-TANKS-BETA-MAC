name: Mac build

on:
  workflow_dispatch:   # Actions sekmesinden elle calistirilir

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: python -m pip install pygame-ce pyinstaller

      - name: Uygulamayi derle
        run: python -m PyInstaller --clean --windowed --icon=simge.icns --name TankSavasi tank_oyunu.py

      - name: Zip'le
        run: ditto -c -k --keepParent dist/TankSavasi.app TankSavasi-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TankSavasi-mac
          path: TankSavasi-mac.zip
